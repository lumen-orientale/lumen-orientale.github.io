colorScheme = "ocean"
defaultAppearance = "light"
autoSwitchAppearance = true
enableA11y = true
enableSearch = true
enableCodeCopy = true
mainSections = ["posts"]
backgroundCanvas = true

[header]
  layout = "fixed"
  mobileMenuStyle = "dropdown"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true
  layoutBackgroundBlur = false

[article]
  showDate = true
  showAuthor = true
  showHero = true
  showBreadcrumbs = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showWordCount = false
  showThumbnail = true
  showZenMode = true
  sharingLinks = ["email", "facebook", "twitter"]

[list]
  showHero = true
  showBreadcrumbs = true
  showSummary = true
  showCards = true
  cardView = true
  groupByYear = true

[author]
  name = "Chavez Cyrillus Mariae Poon"
  headline = "Dixi, et salvavi animam meam!"
  bio = "Founder and Editor of Lumen Orientale"
  image = "img/lumenorientale-logo.jpg"
